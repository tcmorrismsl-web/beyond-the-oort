<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the canvas reach under the notch/Dynamic Island;
         safe-area insets in CSS keep UI clear of it. No zooming in a game. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beyond the Oort" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Beyond the Oort</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        overscroll-behavior: none;   /* no rubber-band bounce */
        touch-action: none;          /* no pinch/double-tap zoom, no scroll */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none; /* no long-press callout menu */
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        height: 100dvh;
      }
      #game canvas { display: block; }
      /* Small "Saved" notice. A DOM element (not canvas) so CSS safe-area
         insets keep it clear of the Dynamic Island in every orientation. */
      #toast {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 10px);
        right: calc(env(safe-area-inset-right) + 14px);
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(20, 28, 44, 0.75);
        color: #dfe8ff;
        font: 600 14px/1.2 -apple-system, system-ui, sans-serif;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      #toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
